[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "step-diff"
version = "0.1.0"
description = "B-Rep based OLD/NEW STEP object matching and design-change detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cadquery-ocp>=7.7", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
step-diff = "step_diff.__main__:main"

[tool.setuptools]
packages = ["step_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
